name: Build installers (Windows, Linux, macOS)

# Se ejecuta en cada PR (validación de que compila y los tests pasan), de forma
# manual desde la pestaña "Actions" o al publicar una tag v*.
# macOS solo se construye si marcas "build-macos" (sus runners son de pago).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      build-macos:
        description: "Construir también los instaladores de macOS (requiere billing: runners macOS de pago)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# Necesario para crear el release borrador con los instaladores adjuntos.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: genera .deb, .rpm y .AppImage (el .rpm requiere rpmbuild, se instala abajo).
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          # Windows: genera .msi (WiX) y .exe (NSIS).
          - platform: windows-latest
            args: ""
            targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Run Rust unit tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and bundle installers
        # En PRs solo validamos (npm build + cargo test); los instaladores y el
        # release borrador se generan en workflow_dispatch o al publicar una tag v*.
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App Monitor v__VERSION__"
          releaseBody: |
            Instaladores generados automáticamente para esta versión:
            - **Windows**: instalador `.exe` (NSIS) y `.msi`
            - **Linux**: `.deb`, `.rpm` y `.AppImage`
            - **macOS**: `.dmg` para Apple Silicon e Intel (si build-macos está activado)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.args || 'x64' }}
          # Con --target (macOS x2) los bundles van a target/<triple>/release/bundle;
          # en builds nativos (Win/Linux) van a target/release/bundle.
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: warn

  # Solo se ejecuta si marcas "build-macos" en Run workflow.
  # Los runners de macOS son de pago: antes, arregla billing en
  # Settings > Billing & plans y establece un spending limit.
  build-macos:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build-macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: Build and bundle installers (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App Monitor v__VERSION__"
          releaseBody: |
            Instaladores generados automáticamente para esta versión:
            - **Windows**: instalador `.exe` (NSIS) y `.msi`
            - **Linux**: `.deb`, `.rpm` y `.AppImage`
            - **macOS**: `.dmg` para Apple Silicon e Intel (si build-macos está activado)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.args }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: warn